name: Build and deploy Node.js app to Azure Web App - sustainplus-ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (prisma generate + next build)
        run: npm run build
        env:
          # Prisma generate only needs the schema — a dummy URL is fine at build time
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-secret-placeholder' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://sustainplus-ai-crh0bqhffyewhxa5.westeurope-01.azurewebsites.net' }}
          NEXT_PUBLIC_PLATFORM_URL: 'https://sustainplus-ai-crh0bqhffyewhxa5.westeurope-01.azurewebsites.net'
          NEXT_PUBLIC_MAIN_SITE_URL: 'https://sustainplus-eg.com'

      - name: Prepare standalone package
        run: |
          # Copy public assets and static files into the standalone output
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

          # Rewrite package.json to ONLY have a start script.
          # The original package.json has "build": "prisma generate && next build"
          # which Azure Oryx would re-run during deployment and fail (no schema.prisma).
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('.next/standalone/package.json', 'utf8'));
            pkg.scripts = { start: 'node server.js' };
            fs.writeFileSync('.next/standalone/package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_86676FDEC0E2484C9A4F8565D7A6A923 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15F3F85CE5DD4E12A40C34C92652F4FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8DA9C8C14EA64431A7B4BA255A8F16C7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sustainplus-ai'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'
