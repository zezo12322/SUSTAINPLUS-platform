name: Build and deploy Node.js app to Azure Web App - sustainplus-ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}

      - name: Build (prisma generate + next build)
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-secret-placeholder' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://sustainplus-ai-crh0bqhffyewhxa5.westeurope-01.azurewebsites.net' }}
          NEXT_PUBLIC_PLATFORM_URL: 'https://sustainplus-ai-crh0bqhffyewhxa5.westeurope-01.azurewebsites.net'
          NEXT_PUBLIC_MAIN_SITE_URL: 'https://sustainplus-eg.com'

      - name: Prepare standalone package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

          # Copy @prisma/client (JS generated files — not traced by Next.js by default)
          mkdir -p .next/standalone/node_modules/@prisma/client
          cp -r node_modules/@prisma/client/. .next/standalone/node_modules/@prisma/client/

          # Copy .prisma/client (standard hidden path — works in CI but Azure OneDeploy
          # strips top-level dotfile directories from the zip, so we also copy to a
          # non-hidden path and patch @prisma/client references to use it)
          mkdir -p .next/standalone/node_modules/.prisma/client
          cp -r node_modules/.prisma/client/. .next/standalone/node_modules/.prisma/client/

          # Non-hidden copy — survives Azure zip deployment
          mkdir -p .next/standalone/node_modules/prisma_generated_client
          cp -r node_modules/.prisma/client/. .next/standalone/node_modules/prisma_generated_client/

          # Patch all @prisma/client JS files to require from prisma_generated_client
          # instead of .prisma/client (which Azure strips from the zip)
          find .next/standalone/node_modules/@prisma/client -name "*.js" -print0 | \
            xargs -0 sed -i \
              "s|require('.prisma/client/|require('prisma_generated_client/|g;
               s|require(\".prisma/client/|require(\"prisma_generated_client/|g" \
            2>/dev/null || true

          echo "=== Prisma files check ==="
          ls -la .next/standalone/node_modules/@prisma/client/default* 2>/dev/null || echo "WARNING: @prisma/client/default.js not found!"
          ls -la .next/standalone/node_modules/prisma_generated_client/*.node 2>/dev/null | head -3
          echo "=== Verify prisma_generated_client ==="
          test -f .next/standalone/node_modules/prisma_generated_client/default.js && echo "OK: prisma_generated_client/default.js found" || echo "ERROR: prisma_generated_client/default.js MISSING"
          echo "=== Verify patch applied ==="
          grep -c "prisma_generated_client" .next/standalone/node_modules/@prisma/client/default.js 2>/dev/null && echo "OK: patch applied" || echo "WARNING: patch may not have applied"

          echo "=== Next.js external runtime files check ==="
          for f in \
            "next/dist/server/app-render/work-async-storage.external.js" \
            "next/dist/server/app-render/work-unit-async-storage.external.js" \
            "next/dist/server/app-render/action-async-storage.external.js" \
            "next/dist/server/load-manifest.external.js" \
            "next/dist/compiled/jsonwebtoken/index.js"; do
            if [ -f ".next/standalone/node_modules/$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
            fi
          done

          # Create a tiny placeholder node_modules.tar.gz.
          # Oryx's startup script checks for this file; if present it extracts it to
          # /node_modules, then moves ./node_modules to _del_node_modules and symlinks
          # ./node_modules -> /node_modules. Our start.sh reverses that immediately,
          # restoring our prepared (patched) node_modules before node starts.
          echo "=== Creating placeholder node_modules.tar.gz for Oryx ==="
          mkdir -p /tmp/oryx_ph
          printf 'placeholder' > /tmp/oryx_ph/placeholder
          (cd /tmp/oryx_ph && tar czf - placeholder) > .next/standalone/node_modules.tar.gz
          echo "OK: $(du -sh .next/standalone/node_modules.tar.gz | cut -f1) — placeholder tar.gz ready"

          # Create start.sh — run as appCommandLine. After Oryx extracts the placeholder
          # and moves our node_modules to _del_node_modules, this script restores it.
          echo "=== Creating start.sh ==="
          node -e "
          const fs = require('fs');
          const s = [
            '#!/bin/sh',
            '# Oryx moves our node_modules to _del_node_modules after tar.gz extraction.',
            '# Restore it so we use our prepared (patched) node_modules.',
            'if [ -d _del_node_modules ] && [ -L node_modules ]; then',
            '  rm -f node_modules',
            '  mv _del_node_modules node_modules',
            'fi',
            'exec node server.js'
          ].join('\n') + '\n';
          fs.writeFileSync('.next/standalone/start.sh', s);
          "
          chmod +x .next/standalone/start.sh
          echo "OK: start.sh created"

      - name: Test standalone server startup
        run: |
          cd .next/standalone

          # Patch server.js to log every failed module resolution
          node -e "
          const fs = require('fs');
          const orig = fs.readFileSync('server.js', 'utf8');
          const patch = \`
          const Module = require('module');
          const _rf = Module._resolveFilename;
          Module._resolveFilename = function(req, parent, isMain, opts) {
            try { return _rf.call(this, req, parent, isMain, opts); }
            catch(e) {
              if (e.code === 'MODULE_NOT_FOUND') {
                console.error('[MISSING_MODULE]', JSON.stringify(req), 'from', parent && parent.id);
              }
              throw e;
            }
          };
          \`;
          fs.writeFileSync('server.js', patch + orig);
          "

          PORT=3333 NODE_ENV=production \
            AUTH_SECRET="ci-test-secret-placeholder-min-32-chars" \
            NEXTAUTH_SECRET="ci-test-secret-placeholder-min-32-chars" \
            DATABASE_URL="postgresql://build:build@localhost:5432/build" \
            NEXTAUTH_URL="http://localhost:3333" \
            node server.js > /tmp/server-stdout.txt 2>&1 &
          SERVER_PID=$!
          sleep 8

          echo "=== Server stdout/stderr (MISSING_MODULE lines) ==="
          grep "\[MISSING_MODULE\]" /tmp/server-stdout.txt || echo "(none)"
          echo "=== Full server output ==="
          cat /tmp/server-stdout.txt || true

          echo "=== Testing /api/ping ==="
          HTTP_CODE=$(curl -s -o /tmp/ping-body.txt -w "%{http_code}" http://localhost:3333/api/ping || echo "000")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/ping-body.txt || true

          echo "=== Testing /api/env (Pages Router) ==="
          HTTP_CODE2=$(curl -s -o /tmp/env-body.txt -w "%{http_code}" http://localhost:3333/api/env || echo "000")
          echo "HTTP status: $HTTP_CODE2"
          cat /tmp/env-body.txt || true

          kill $SERVER_PID 2>/dev/null || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /api/ping returned $HTTP_CODE on CI — build fails"
            exit 1
          fi
          echo "✅ /api/ping OK"

      - name: Verify .prisma/client in standalone
        run: |
          echo "=== prisma_generated_client files (non-hidden, survives Azure zip) ==="
          ls -la .next/standalone/node_modules/prisma_generated_client/ | head -20
          echo "=== Verify default.js exists ==="
          test -f .next/standalone/node_modules/prisma_generated_client/default.js && echo "OK: default.js found" || { echo "ERROR: default.js MISSING"; exit 1; }
          echo "=== Native binaries ==="
          ls -la .next/standalone/node_modules/prisma_generated_client/*.node 2>/dev/null || echo "WARNING: no .node binaries found"
          echo "=== Verify @prisma/client patch ==="
          grep "prisma_generated_client" .next/standalone/node_modules/@prisma/client/default.js && echo "OK: patch active" || { echo "ERROR: patch NOT applied to @prisma/client/default.js"; exit 1; }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_86676FDEC0E2484C9A4F8565D7A6A923 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15F3F85CE5DD4E12A40C34C92652F4FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8DA9C8C14EA64431A7B4BA255A8F16C7 }}

      - name: Configure Azure App Service (general)
        uses: azure/appservice-settings@v1
        with:
          app-name: sustainplus-ai
          app-settings-json: '[{"name":"SCM_DO_BUILD_DURING_DEPLOYMENT","value":"false","slotSetting":false}]'
          general-settings-json: '{"appCommandLine":"/bin/sh start.sh","linuxFxVersion":"NODE|22-lts"}'

      - name: Set all environment variables in Azure App Service
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET_VAL: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL_VAL: ${{ secrets.NEXTAUTH_URL }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RG=$(az webapp list --query "[?name=='sustainplus-ai'].resourceGroup | [0]" --output tsv)
          SITE_URL="https://sustainplus-ai-crh0bqhffyewhxa5.westeurope-01.azurewebsites.net"
          FINAL_URL="${NEXTAUTH_URL_VAL:-$SITE_URL}"

          # Base settings — always overwrite
          SETTINGS=(
            "NODE_ENV=production"
            "AUTH_TRUST_HOST=true"
            "NEXTAUTH_URL=$FINAL_URL"
            "AUTH_URL=$FINAL_URL"
            "NEXT_PUBLIC_PLATFORM_URL=$SITE_URL"
            "NEXT_PUBLIC_MAIN_SITE_URL=https://sustainplus-eg.com"
          )

          # Secret settings — only set when the GitHub secret is non-empty
          [ -n "$DB_URL" ]          && SETTINGS+=("DATABASE_URL=$DB_URL")
          [ -n "$AUTH_SECRET_VAL" ] && SETTINGS+=("NEXTAUTH_SECRET=$AUTH_SECRET_VAL" "AUTH_SECRET=$AUTH_SECRET_VAL")
          [ -n "$GEMINI_KEY" ]      && SETTINGS+=("GEMINI_API_KEY=$GEMINI_KEY")
          [ -n "$ANTHROPIC_KEY" ]   && SETTINGS+=("ANTHROPIC_API_KEY=$ANTHROPIC_KEY")

          echo "Applying ${#SETTINGS[@]} app settings to $RG/sustainplus-ai ..."
          az webapp config appsettings set \
            --name sustainplus-ai \
            --resource-group "$RG" \
            --settings "${SETTINGS[@]}"
          echo "App settings updated."

      - name: Open PostgreSQL firewall for Azure services
        run: |
          PG_RG=$(az postgres flexible-server list \
            --query "[?name=='sustainplus-db'].resourceGroup | [0]" \
            --output tsv 2>/dev/null || echo "")
          if [ -n "$PG_RG" ]; then
            echo "Found PostgreSQL server in resource group: $PG_RG"
            az postgres flexible-server firewall-rule create \
              --name sustainplus-db \
              --resource-group "$PG_RG" \
              --rule-name AllowAllAzureServices \
              --start-ip-address 0.0.0.0 \
              --end-ip-address 0.0.0.0 2>/dev/null \
              && echo "Firewall rule created/updated." \
              || echo "Rule may already exist — skipping."
          else
            echo "WARNING: Could not find PostgreSQL server 'sustainplus-db' in this subscription."
            echo "Manually enable 'Allow Azure services' in the Azure Portal > PostgreSQL > Networking."
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sustainplus-ai'
          slot-name: 'Production'
          package: .

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for app to boot..."
          sleep 30
          RG=$(az webapp list --query "[?name=='sustainplus-ai'].resourceGroup | [0]" --output tsv)

          az webapp log config \
            --name sustainplus-ai \
            --resource-group "$RG" \
            --application-logging filesystem \
            --level verbose

          SITE_URL="https://sustainplus-ai-crh0bqhffyewhxa5.westeurope-01.azurewebsites.net"

          echo "=== Testing /api/ping ==="
          PING=$(curl -sf "$SITE_URL/api/ping" 2>/dev/null || echo "FAILED")
          echo "$PING"

          echo "=== Testing /api/health ==="
          HEALTH=$(curl -sf "$SITE_URL/api/health" 2>/dev/null || echo "FAILED")
          echo "$HEALTH"

          echo "=== STARTUP LOGS (30 seconds) ==="
          timeout 30 az webapp log tail \
            --name sustainplus-ai \
            --resource-group "$RG" || true

          if echo "$HEALTH" | grep -q '"prisma":{"status":"ok"'; then
            echo "✅ Database connection OK"
          elif echo "$HEALTH" | grep -q '"prisma":{"status":"error"'; then
            DB_ERR=$(echo "$HEALTH" | grep -o '"message":"[^"]*"' | head -1)
            echo "❌ Database error: $DB_ERR"
            echo "Check: Azure PostgreSQL firewall rules and DATABASE_URL in App Service settings."
            exit 1
          else
            echo "⚠️ Health endpoint did not return expected format. Check logs above."
          fi
