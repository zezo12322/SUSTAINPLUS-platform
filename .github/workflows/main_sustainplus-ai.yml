name: Build and deploy Node.js app to Azure Web App - sustainplus-ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_DB_SECRET: ${{ secrets.DATABASE_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: 'postgresql://build:build@localhost:5432/build'
          NEXTAUTH_SECRET: 'test-secret-placeholder'
          NODE_ENV: 'test'

      # --- Apply Prisma schema to the production Postgres (additive db push) ---
      # The Azure PostgreSQL firewall only allows Azure services, so we briefly
      # whitelist this runner's IP, push, then remove the rule (trap on EXIT).
      - name: Azure login (for DB schema push)
        if: ${{ env.HAS_DB_SECRET == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_86676FDEC0E2484C9A4F8565D7A6A923 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15F3F85CE5DD4E12A40C34C92652F4FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8DA9C8C14EA64431A7B4BA255A8F16C7 }}

      - name: Push Prisma schema to database
        if: ${{ env.HAS_DB_SECRET == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          PG_SERVER="sustainplus-pg"
          PG_RG="Sustainplus"
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          echo "Runner IP: $RUNNER_IP ; PG resource group: $PG_RG"

          if [ -n "$PG_RG" ] && [ -n "$RUNNER_IP" ]; then
            RULE="gha-dbpush-${GITHUB_RUN_ID}"
            cleanup() {
              az postgres flexible-server firewall-rule delete \
                --server-name "$PG_SERVER" --resource-group "$PG_RG" \
                --name "$RULE" --yes >/dev/null 2>&1 || true
              echo "Removed temporary firewall rule $RULE"
            }
            trap cleanup EXIT
            az postgres flexible-server firewall-rule create \
              --server-name "$PG_SERVER" --resource-group "$PG_RG" \
              --name "$RULE" \
              --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null
            echo "Opened temporary firewall rule $RULE for $RUNNER_IP"
            sleep 5
          else
            echo "WARNING: could not resolve PG server or runner IP; attempting db push anyway."
          fi

          echo "=== prisma db push (additive schema sync) ==="
          npx prisma db push --skip-generate
          echo "Schema pushed to database."

      - name: Verify Prisma client after generate
        run: |
          echo "=== Verify local Prisma generated client ==="
          test -f node_modules/.prisma/client/default.js
          test -f node_modules/@prisma/client/default.js

          echo "=== @prisma/client/default.js ==="
          cat node_modules/@prisma/client/default.js

          echo "=== Verify @prisma/client uses standard .prisma path ==="
          grep -F ".prisma/client" node_modules/@prisma/client/default.js

          echo "=== Verify @prisma/client/default.js is standard ==="
          grep -F ".prisma/client" node_modules/@prisma/client/default.js

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@localhost:5432/build' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-secret-placeholder' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://www.sustainplus-eg.com' }}
          NEXT_PUBLIC_PLATFORM_URL: 'https://www.sustainplus-eg.com'
          NEXT_PUBLIC_MAIN_SITE_URL: 'https://sustainplus-eg.com'

      - name: Prepare standalone package
        run: |
          echo "=== Prepare Next standalone package ==="

          mkdir -p .next/standalone/.next

          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi

          cp -a .next/static .next/standalone/.next/static

          echo "=== Copy standard Prisma client into standalone node_modules ==="
          mkdir -p .next/standalone/node_modules

          rm -rf .next/standalone/node_modules/@prisma
          rm -rf .next/standalone/node_modules/.prisma

          cp -a node_modules/@prisma .next/standalone/node_modules/@prisma
          cp -a node_modules/.prisma .next/standalone/node_modules/.prisma

          echo "=== Verify standard Prisma client in standalone ==="
          test -f .next/standalone/node_modules/@prisma/client/default.js
          test -f .next/standalone/node_modules/.prisma/client/default.js

          echo "=== @prisma/client/default.js in standalone ==="
          cat .next/standalone/node_modules/@prisma/client/default.js

          echo "=== Verify @prisma/client points to .prisma/client ==="
          grep -F ".prisma/client" .next/standalone/node_modules/@prisma/client/default.js


          echo "=== Verify standalone @prisma/client/default.js is standard ==="
          grep -F ".prisma/client" .next/standalone/node_modules/@prisma/client/default.js

          echo "=== Native Prisma binaries in standalone ==="
          ls -la .next/standalone/node_modules/.prisma/client/*.node 2>/dev/null || {
            echo "ERROR: Prisma native binaries missing"
            exit 1
          }

          echo "=== Next.js external runtime files check ==="
          for f in \
            "next/dist/server/app-render/work-async-storage.external.js" \
            "next/dist/server/app-render/work-unit-async-storage.external.js" \
            "next/dist/server/app-render/action-async-storage.external.js" \
            "next/dist/server/load-manifest.external.js" \
            "next/dist/compiled/jsonwebtoken/index.js"; do
            if [ -f ".next/standalone/node_modules/$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
            fi
          done

          echo "=== Create start.sh ==="
          cat > .next/standalone/start.sh <<'EOF'
          #!/bin/sh
          exec node server.js
          EOF

          chmod +x .next/standalone/start.sh
          echo "OK: start.sh created"

      - name: Verify standalone Prisma package
        run: |
          echo "=== Verify files before artifact upload ==="
          test -f .next/standalone/node_modules/.prisma/client/default.js
          test -f .next/standalone/node_modules/@prisma/client/default.js

          echo "=== Verify tar simulation preserves .prisma ==="
          tar -czf /tmp/node_modules-test.tar.gz -C .next/standalone node_modules
          tar -tzf /tmp/node_modules-test.tar.gz | grep "node_modules/.prisma/client/default.js"
          tar -tzf /tmp/node_modules-test.tar.gz | grep "node_modules/@prisma/client/default.js"


      - name: Test standalone server startup
        run: |
          cd .next/standalone

          node -e "
          const fs = require('fs');
          const orig = fs.readFileSync('server.js', 'utf8');
          const patch = \`
          const Module = require('module');
          const _rf = Module._resolveFilename;
          Module._resolveFilename = function(req, parent, isMain, opts) {
            try { return _rf.call(this, req, parent, isMain, opts); }
            catch(e) {
              if (e.code === 'MODULE_NOT_FOUND') {
                console.error('[MISSING_MODULE]', JSON.stringify(req), 'from', parent && parent.id);
              }
              throw e;
            }
          };
          \`;
          fs.writeFileSync('server.js', patch + orig);
          "

          PORT=3333 NODE_ENV=production \
            AUTH_SECRET="ci-test-secret-placeholder-min-32-chars" \
            NEXTAUTH_SECRET="ci-test-secret-placeholder-min-32-chars" \
            DATABASE_URL="postgresql://build:build@localhost:5432/build" \
            NEXTAUTH_URL="http://localhost:3333" \
            NEXT_PUBLIC_PLATFORM_URL="http://localhost:3333" \
            NEXT_PUBLIC_MAIN_SITE_URL="https://sustainplus-eg.com" \
            node server.js > /tmp/server-stdout.txt 2>&1 &

          SERVER_PID=$!
          sleep 8

          echo "=== Server stdout/stderr MISSING_MODULE lines ==="
          grep "\[MISSING_MODULE\]" /tmp/server-stdout.txt || echo "(none)"

          echo "=== Full server output ==="
          cat /tmp/server-stdout.txt || true

          echo "=== Testing /api/ping ==="
          HTTP_CODE=$(curl -s -o /tmp/ping-body.txt -w "%{http_code}" http://localhost:3333/api/ping || echo "000")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/ping-body.txt || true

          echo "=== Testing /api/env ==="
          HTTP_CODE2=$(curl -s -o /tmp/env-body.txt -w "%{http_code}" http://localhost:3333/api/env || echo "000")
          echo "HTTP status: $HTTP_CODE2"
          cat /tmp/env-body.txt || true

          kill $SERVER_PID 2>/dev/null || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /api/ping returned $HTTP_CODE on CI — build fails"
            exit 1
          fi

          echo "✅ /api/ping OK"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_86676FDEC0E2484C9A4F8565D7A6A923 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15F3F85CE5DD4E12A40C34C92652F4FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8DA9C8C14EA64431A7B4BA255A8F16C7 }}

      - name: Debug Azure account
        run: |
          echo "=== Azure account ==="
          az account show --query "{name:name,id:id,tenantId:tenantId}" -o table

          echo "=== PostgreSQL servers visible to this identity ==="
          az postgres flexible-server list \
            --query "[].{name:name,resourceGroup:resourceGroup,fqdn:fullyQualifiedDomainName}" \
            -o table || true

      - name: Configure Azure App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: sustainplus-ai-eg
          app-settings-json: '[{"name":"SCM_DO_BUILD_DURING_DEPLOYMENT","value":"false","slotSetting":false}]'
          general-settings-json: '{"appCommandLine":"/bin/sh start.sh","linuxFxVersion":"NODE|22-lts"}'

      - name: Set all environment variables in Azure App Service
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET_VAL: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL_VAL: ${{ secrets.NEXTAUTH_URL }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OAI_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_VAL: ${{ secrets.EMAIL_FROM }}
          PAYMOB_API_KEY_VAL: ${{ secrets.PAYMOB_API_KEY }}
          PAYMOB_HMAC_VAL: ${{ secrets.PAYMOB_HMAC_SECRET }}
          PAYMOB_IFRAME_VAL: ${{ secrets.PAYMOB_IFRAME_ID }}
          PAYMOB_INT_CARD_VAL: ${{ secrets.PAYMOB_INTEGRATION_ID_CARD }}
        run: |
          RG="Sustainplus"
          SITE_URL="https://sustainplus-ai-eg.azurewebsites.net"
          FINAL_URL="${NEXTAUTH_URL_VAL:-$SITE_URL}"

          SETTINGS=(
            "NODE_ENV=production"
            "AUTH_TRUST_HOST=true"
            "NEXTAUTH_URL=$FINAL_URL"
            "AUTH_URL=$FINAL_URL"
            "NEXT_PUBLIC_PLATFORM_URL=$FINAL_URL"
            "NEXT_PUBLIC_MAIN_SITE_URL=https://sustainplus-eg.com"
          )

          [ -n "$DB_URL" ]              && SETTINGS+=("DATABASE_URL=$DB_URL")
          [ -n "$AUTH_SECRET_VAL" ]     && SETTINGS+=("NEXTAUTH_SECRET=$AUTH_SECRET_VAL" "AUTH_SECRET=$AUTH_SECRET_VAL")
          [ -n "$GEMINI_KEY" ]          && SETTINGS+=("GEMINI_API_KEY=$GEMINI_KEY")
          [ -n "$ANTHROPIC_KEY" ]       && SETTINGS+=("ANTHROPIC_API_KEY=$ANTHROPIC_KEY")
          [ -n "$AZURE_OAI_KEY" ]       && SETTINGS+=("AZURE_OPENAI_API_KEY=$AZURE_OAI_KEY")
          [ -n "$AZURE_OAI_ENDPOINT" ]  && SETTINGS+=("AZURE_OPENAI_ENDPOINT=$AZURE_OAI_ENDPOINT")
          [ -n "$AZURE_OAI_DEPLOYMENT" ] && SETTINGS+=("AZURE_OPENAI_DEPLOYMENT=$AZURE_OAI_DEPLOYMENT")
          [ -n "$RESEND_KEY" ]          && SETTINGS+=("RESEND_API_KEY=$RESEND_KEY")
          [ -n "$EMAIL_FROM_VAL" ]      && SETTINGS+=("EMAIL_FROM=$EMAIL_FROM_VAL")
          [ -n "$PAYMOB_API_KEY_VAL" ]  && SETTINGS+=("PAYMOB_API_KEY=$PAYMOB_API_KEY_VAL")
          [ -n "$PAYMOB_HMAC_VAL" ]     && SETTINGS+=("PAYMOB_HMAC_SECRET=$PAYMOB_HMAC_VAL")
          [ -n "$PAYMOB_IFRAME_VAL" ]   && SETTINGS+=("PAYMOB_IFRAME_ID=$PAYMOB_IFRAME_VAL")
          [ -n "$PAYMOB_INT_CARD_VAL" ] && SETTINGS+=("PAYMOB_INTEGRATION_ID_CARD=$PAYMOB_INT_CARD_VAL")

          echo "Applying ${#SETTINGS[@]} app settings to $RG/sustainplus-ai ..."
          # -o none: do NOT echo the settings (they contain secrets) back to the CI log.
          az webapp config appsettings set \
            --name sustainplus-ai-eg \
            --resource-group "$RG" \
            --settings "${SETTINGS[@]}" \
            -o none

          echo "App settings updated."

      - name: Open PostgreSQL firewall for Azure services
        run: |
          PG_RG="Sustainplus"
          az postgres flexible-server firewall-rule create \
            --server-name sustainplus-pg \
            --resource-group "$PG_RG" \
            --name AllowAllAzureServices \
            --start-ip-address 0.0.0.0 \
            --end-ip-address 0.0.0.0 2>/dev/null \
            && echo "Firewall rule created/updated." \
            || echo "Rule may already exist — skipping."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: sustainplus-ai-eg
          slot-name: Production
          package: .

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for app to boot..."
          sleep 30

          RG="Sustainplus"

          az webapp log config \
            --name sustainplus-ai-eg \
            --resource-group "$RG" \
            --application-logging filesystem \
            --level verbose

          SITE_URL="https://sustainplus-ai-eg.azurewebsites.net"

          echo "=== Testing /api/ping ==="
          PING=$(curl -sf "$SITE_URL/api/ping" 2>/dev/null || echo "FAILED")
          echo "$PING"

          echo "=== Testing /api/health ==="
          HEALTH=$(curl -sf "$SITE_URL/api/health" 2>/dev/null || echo "FAILED")
          echo "$HEALTH"

          echo "=== STARTUP LOGS (30 seconds) ==="
          timeout 30 az webapp log tail \
            --name sustainplus-ai-eg \
            --resource-group "$RG" || true

          if echo "$HEALTH" | grep -q '"prisma":{"status":"ok"'; then
            echo "✅ Database connection OK"
          elif echo "$HEALTH" | grep -q '"prisma":{"status":"error"'; then
            DB_ERR=$(echo "$HEALTH" | grep -o '"message":"[^"]*"' | head -1)
            echo "❌ Database error: $DB_ERR"
            echo "Check: Azure PostgreSQL firewall rules and DATABASE_URL in App Service settings."
            exit 1
          else
            echo "⚠️ Health endpoint did not return expected format. Check logs above."
          fi